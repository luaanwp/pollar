name: Publish Pollar updates

on:
  push:
    branches: [main]
    paths:
      - 'apps/pollar_app/**'
      - 'tools/**'
      - 'tests/**'
      - 'packaging/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/publish-updates.yml'
  workflow_dispatch:

concurrency:
  group: pollar-stable-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # local_auth_windows still uses the legacy WinRT coroutine integration.
    # VS 2026's newest STL rejects it; use the supported VS 2022 image.
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0, Node 24
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
          # Kotlin needs plugin sources and the project on the same drive.
          pub-cache-path: ${{ github.workspace }}/.pub-cache
          pub-cache-key: 'pollar-pub-workspace-v1-:os:-:channel:-:version:-:arch:-:hash:'
      - name: Configure backend and existing Android signing identity
        env:
          POLLAR_SUPABASE_URL: ${{ vars.POLLAR_SUPABASE_URL }}
          POLLAR_SUPABASE_PUBLISHABLE_KEY: ${{ vars.POLLAR_SUPABASE_PUBLISHABLE_KEY }}
          POLLAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.POLLAR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Restore-preview goldens display local time while retaining a UTC
          # filename/checksum. Match the approved Brazilian reference machine.
          tzutil.exe /s "E. South America Standard Time"
          if ($LASTEXITCODE -ne 0) { throw 'Could not set golden-test timezone.' }
          if ([IO.Path]::GetPathRoot($env:PUB_CACHE) -ine [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) { throw 'Pub cache must be on the workspace drive for Kotlin compilation.' }
          if (-not $env:POLLAR_SUPABASE_URL -or -not $env:POLLAR_SUPABASE_PUBLISHABLE_KEY -or -not $env:POLLAR_ANDROID_KEYSTORE_BASE64) { throw 'Update publishing configuration is missing.' }
          @{ SUPABASE_URL = $env:POLLAR_SUPABASE_URL; SUPABASE_PUBLISHABLE_KEY = $env:POLLAR_SUPABASE_PUBLISHABLE_KEY } | ConvertTo-Json | Set-Content apps/pollar_app/config/supabase.remote.json -Encoding utf8
          $keystore = Join-Path $env:RUNNER_TEMP 'pollar-updates.keystore'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:POLLAR_ANDROID_KEYSTORE_BASE64))
          "POLLAR_ANDROID_KEYSTORE_PATH=$keystore" >> $env:GITHUB_ENV
          $version = [regex]::Match((Get-Content apps/pollar_app/pubspec.yaml -Raw), '(?m)^version:\s*(\d+\.\d+\.\d+)').Groups[1].Value
          if (-not $version) { throw 'Version missing' }
          "POLLAR_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "POLLAR_RELEASE_BUILD=$([int]$env:GITHUB_RUN_NUMBER + 1000)" >> $env:GITHUB_ENV
      - name: Resolve dependencies and verify
        working-directory: apps/pollar_app
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub --exclude-tags=windows-process
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Windows update processes
        working-directory: apps/pollar_app
        run: |
          # Native process startup must not compete with the parallel UI suites.
          flutter test --no-pub --concurrency=1 test/features/updates/windows_update_launcher_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File ../../tests/windows-package.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File ../../tests/windows-update.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows update
        working-directory: apps/pollar_app
        run: |
          flutter build windows --release --no-pub --build-name=$env:POLLAR_RELEASE_VERSION --build-number=$env:POLLAR_RELEASE_BUILD --dart-define-from-file=config/supabase.remote.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Android update
        working-directory: apps/pollar_app
        env:
          POLLAR_ANDROID_STORE_PASSWORD: ${{ secrets.POLLAR_ANDROID_STORE_PASSWORD }}
          POLLAR_ANDROID_KEY_ALIAS: ${{ secrets.POLLAR_ANDROID_KEY_ALIAS }}
          POLLAR_ANDROID_KEY_PASSWORD: ${{ secrets.POLLAR_ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --no-pub --build-name=$env:POLLAR_RELEASE_VERSION --build-number=$env:POLLAR_RELEASE_BUILD --dart-define-from-file=config/supabase.remote.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and publish after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          POLLAR_ANDROID_CERT_SHA256: ${{ vars.POLLAR_ANDROID_CERT_SHA256 }}
        run: ./tools/publish-updates.ps1 -Version "$env:POLLAR_RELEASE_VERSION+$env:POLLAR_RELEASE_BUILD" -Commit $env:GITHUB_SHA
