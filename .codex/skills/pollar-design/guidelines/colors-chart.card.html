<!-- @dsCard group="Colors" viewport="700x130" name="Categorical chart palette" subtitle="Eight-step order; charts must also expose labels, values and a text alternative" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-canvas);padding:20px;display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-sm)}
.n{font:600 10px/1.2 var(--font-mono);color:var(--text-muted)}</style>
</head><body>
<div class="sw"><div class="chip" style="background:var(--chart-1)"></div><span class="n">chart-1</span></div><div class="sw"><div class="chip" style="background:var(--chart-2)"></div><span class="n">chart-2</span></div><div class="sw"><div class="chip" style="background:var(--chart-3)"></div><span class="n">chart-3</span></div><div class="sw"><div class="chip" style="background:var(--chart-4)"></div><span class="n">chart-4</span></div><div class="sw"><div class="chip" style="background:var(--chart-5)"></div><span class="n">chart-5</span></div><div class="sw"><div class="chip" style="background:var(--chart-6)"></div><span class="n">chart-6</span></div><div class="sw"><div class="chip" style="background:var(--chart-7)"></div><span class="n">chart-7</span></div><div class="sw"><div class="chip" style="background:var(--chart-8)"></div><span class="n">chart-8</span></div>
</body></html>
