<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-canvas);padding:20px;display:flex;gap:12px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(19,32,29,.08)}
.n{font:600 12px/1.2 var(--font-sans);color:var(--text-primary)}.v{font:500 11px/1.2 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}</style>
</head><body>
<div class="sw"><div class="chip" style="background:var(--color-primary-600)"></div><span class="n">--primary · 600</span><span class="v">#087F6B</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-700)"></div><span class="n">--primary-hover · 700</span><span class="v">#066858</span></div>
<div class="sw"><div class="chip" style="background:var(--color-primary-50)"></div><span class="n">--primary-soft · 50</span><span class="v">#EAF8F4</span></div>
</body></html>
