<!-- @dsCard group="Brand" viewport="700x170" name="Elevation" subtitle="Border and surface contrast first; shadows only for floating layers" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-background);padding:24px;display:flex;gap:16px;align-items:center}
.b{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center}
.card{width:100%;height:66px;background:var(--surface-canvas);border:1px solid var(--border);border-radius:var(--radius-lg)}
.n{font:500 10px/1.3 var(--font-mono);color:var(--text-muted);text-align:center}</style>
</head><body>
<div class="b"><div class="card"></div><span class="n">0 · rest<br>border only</span></div>
<div class="b"><div class="card" style="box-shadow:var(--elevation-1)"></div><span class="n">1 · card hover</span></div>
<div class="b"><div class="card" style="box-shadow:var(--elevation-2)"></div><span class="n">2 · menu, popover, toast</span></div>
<div class="b"><div class="card" style="box-shadow:var(--elevation-3)"></div><span class="n">3 · dialog, bottom sheet</span></div>
</body></html>
