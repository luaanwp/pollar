<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark placeholder" subtitle="No logo file was supplied — the name is set in plain Inter 650 wherever a mark would go" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-canvas);padding:20px;display:flex;align-items:center;gap:28px}
.lock{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--primary)}
.w{font:650 24px/1 var(--font-sans);letter-spacing:-.02em;color:var(--text-primary)}
.on{background:var(--primary);border-radius:var(--radius-md);padding:14px 18px;display:flex;align-items:center;gap:10px}
.on .w{color:#fff}.on .mark{background:rgba(255,255,255,.9)}
.n{font:400 12px/1.5 var(--font-sans);color:var(--text-muted);max-width:230px}</style>
</head><body>
<div class="lock"><span class="mark"></span><span class="w">Pollar</span></div>
<div class="on"><span class="mark"></span><span class="w">Pollar</span></div>
<p class="n">Pollar is the official product name. The square stands in for an abstract ledger/flow mark — never a currency symbol, and never a reconstructed logo.</p>
</body></html>
