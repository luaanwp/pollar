<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — positive, negative, warning, info" subtitle="Never the only status cue: always pair with an icon and a text label" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-canvas);padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{display:flex;flex-direction:column;gap:8px}.chip{height:56px;border-radius:var(--radius-md)}
.n{font:600 12px/1.2 var(--font-sans);color:var(--text-primary)}.v{font:500 11px/1.2 var(--font-mono);color:var(--text-muted)}
.soft{height:16px;border-radius:var(--radius-sm);border:1px solid rgba(19,32,29,.06)}</style>
</head><body>
<div class="sw"><div class="chip" style="background:var(--positive)"></div><div class="soft" style="background:var(--positive-soft)"></div><span class="n">positive / income</span><span class="v">#16834F</span></div>
<div class="sw"><div class="chip" style="background:var(--negative)"></div><div class="soft" style="background:var(--negative-soft)"></div><span class="n">negative / overdue</span><span class="v">#C53B3B</span></div>
<div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="soft" style="background:var(--warning-soft)"></div><span class="n">warning</span><span class="v">#A86508</span></div>
<div class="sw"><div class="chip" style="background:var(--info)"></div><div class="soft" style="background:var(--info-soft)"></div><span class="n">info / transfers</span><span class="v">#2667C9</span></div>
</body></html>
