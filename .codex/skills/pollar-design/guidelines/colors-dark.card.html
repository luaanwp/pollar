<!-- @dsCard group="Colors" viewport="700x160" name="Dark theme" subtitle="Same semantic names under [data-theme=dark]" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0}
.wrap{background:#0C1211;padding:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{display:flex;flex-direction:column;gap:7px}.chip{height:46px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.10)}
.n{font:600 11px/1.2 var(--font-sans);color:#EEF4F2}.v{font:500 10px/1.2 var(--font-mono);color:#8B9B96}</style>
</head><body data-theme="dark"><div class="wrap">
<div class="sw"><div class="chip" style="background:#5ED3B8"></div><span class="n">primary</span><span class="v">#5ED3B8</span></div>
<div class="sw"><div class="chip" style="background:#153B34"></div><span class="n">primary-soft</span><span class="v">#153B34</span></div>
<div class="sw"><div class="chip" style="background:#121A18"></div><span class="n">canvas</span><span class="v">#121A18</span></div>
<div class="sw"><div class="chip" style="background:#1A2522"></div><span class="n">surface-alt</span><span class="v">#1A2522</span></div>
<div class="sw"><div class="chip" style="background:#2D3B37"></div><span class="n">border</span><span class="v">#2D3B37</span></div>
<div class="sw"><div class="chip" style="background:#EEF4F2"></div><span class="n">text-primary</span><span class="v">#EEF4F2</span></div>
<div class="sw"><div class="chip" style="background:#55CF91"></div><span class="n">positive</span><span class="v">#55CF91</span></div>
<div class="sw"><div class="chip" style="background:#FF8585"></div><span class="n">negative</span><span class="v">#FF8585</span></div>
<div class="sw"><div class="chip" style="background:#F3B85D"></div><span class="n">warning</span><span class="v">#F3B85D</span></div>
<div class="sw"><div class="chip" style="background:#80AEFF"></div><span class="n">info</span><span class="v">#80AEFF</span></div>
</div></body></html>
