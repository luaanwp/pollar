<!-- @dsCard group="Colors" viewport="700x160" name="Neutrals — surfaces, borders, text" subtitle="Canvas, app background, surface alt, borders and the three text tones" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-canvas);padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{display:flex;flex-direction:column;gap:7px}.chip{height:46px;border-radius:var(--radius-sm);border:1px solid rgba(19,32,29,.10)}
.n{font:600 11px/1.2 var(--font-sans);color:var(--text-primary)}.v{font:500 10px/1.2 var(--font-mono);color:var(--text-muted)}</style>
</head><body>
<div class="sw"><div class="chip" style="background:var(--color-neutral-0)"></div><span class="n">canvas · 0</span><span class="v">#FFFFFF</span></div>
<div class="sw"><div class="chip" style="background:var(--color-neutral-25)"></div><span class="n">background · 25</span><span class="v">#F7F9F8</span></div>
<div class="sw"><div class="chip" style="background:var(--color-neutral-50)"></div><span class="n">surface-alt · 50</span><span class="v">#F1F4F3</span></div>
<div class="sw"><div class="chip" style="background:var(--color-neutral-200)"></div><span class="n">border · 200</span><span class="v">#D8DEDC</span></div>
<div class="sw"><div class="chip" style="background:var(--color-neutral-300)"></div><span class="n">border-strong · 300</span><span class="v">#B9C3C0</span></div>
<div class="sw"><div class="chip" style="background:var(--color-neutral-500)"></div><span class="n">text-muted · 500</span><span class="v">#74827E</span></div>
<div class="sw"><div class="chip" style="background:var(--color-neutral-650)"></div><span class="n">text-secondary · 650</span><span class="v">#52615D</span></div>
<div class="sw"><div class="chip" style="background:var(--color-neutral-950)"></div><span class="n">text-primary · 950</span><span class="v">#13201D</span></div>
</body></html>
