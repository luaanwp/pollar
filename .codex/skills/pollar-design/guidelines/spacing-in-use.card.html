<!-- @dsCard group="Spacing" viewport="700x210" name="Spacing in use — dashboard card" subtitle="20px card padding, 12px stack gap, 16px grid gutter" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-background);padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.card{background:var(--surface-canvas);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);position:relative}
.lab{font:600 13px/1.35 var(--font-sans);color:var(--text-secondary)}
.amt{font-variant-numeric:tabular-nums;font-size:34px;font-weight:650;line-height:1.15;color:var(--text-primary)}
.sub{font-size:12px;color:var(--text-muted)}
.tag{position:absolute;font:500 10px/1 var(--font-mono);color:var(--primary);background:var(--primary-soft);border-radius:4px;padding:2px 5px}</style>
</head><body>
<div class="card"><span class="tag" style="top:6px;right:6px">padding 20</span><span class="lab">Saldo total</span><span class="amt">R$ 18.734,55</span><span class="sub">gap 12 entre elementos empilhados</span></div>
<div class="card"><span class="tag" style="top:6px;right:6px">gutter 16</span><span class="lab">Resultado do mês</span><span class="amt">R$ 1.910,00</span><span class="sub">grid de 12 colunas · gutter 24 em telas expandidas</span></div>
</body></html>
