<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-canvas);padding:20px;display:flex;gap:16px;align-items:center}
.b{display:flex;flex-direction:column;gap:8px;align-items:center}
.sq{width:84px;height:64px;background:var(--surface-alt);border:1px solid var(--border-strong)}
.n{font:500 10px/1.2 var(--font-mono);color:var(--text-muted)}
.pill{height:24px;padding:0 12px;display:inline-flex;align-items:center;border-radius:999px;background:var(--positive-soft);color:var(--positive);font:600 12px/1 var(--font-sans)}</style>
</head><body>
<div class="b"><div class="sq" style="border-radius:6px"></div><span class="n">sm 6 · chips</span></div>
<div class="b"><div class="sq" style="border-radius:10px"></div><span class="n">md 10 · inputs, buttons</span></div>
<div class="b"><div class="sq" style="border-radius:14px"></div><span class="n">lg 14 · cards, dialogs</span></div>
<div class="b"><span class="pill">Paga</span><span class="n">pill 999 · badges only</span></div>
</body></html>
