<!-- @dsCard group="Components" viewport="700x330" name="Forms — Input, CurrencyInput, Select, Checkbox, Switch" subtitle="Labels above the field, currency prefix, error/success and selection controls" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--surface-canvas);padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.row{display:flex;gap:24px;align-items:center;margin-top:18px;flex-wrap:wrap}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Input, CurrencyInput, Select, Checkbox, Switch } = window.PollarDesignSystem_efbbc4;
function Demo(){
  const [minor,setMinor]=React.useState(123456);
  const [priv,setPriv]=React.useState(true);
  return <>
    <div className="grid">
      <Input label="Descrição" placeholder="Ex. Mercado do bairro" />
      <CurrencyInput label="Valor da compra" valueMinor={minor} onChangeMinor={setMinor} installments={12} />
      <Select label="Conta" options={["Conta corrente","Poupança","Cartão Ouro"]} />
      <Input label="E-mail" defaultValue="nome@dominio" error="Informe um e-mail válido, como nome@dominio.com" />
      <Input label="Vencimento" iconLeft="calendar" defaultValue="10 set 2026" readOnly hint="Somente leitura" />
      <Input label="Meta mensal" prefix="R$" align="right" defaultValue="4.500,00" success="Meta salva" />
    </div>
    <div className="row">
      <Checkbox label="Selecionar todos" indeterminate />
      <Checkbox label="Conciliado" checked />
      <Checkbox label="Desativado" disabled />
      <Switch label="Modo privacidade" description="Oculta valores em todas as telas" checked={priv} onChange={()=>setPriv(!priv)} />
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
